<!DOCTYPE html>
<html>
<head>
    <title>Edit Walk - Walking Pad Tracker</title>
</head>
<body>
    <h1>Edit Walk</h1>
    <form action="/edit_walk/{{ walk.id }}" method="post">
        Time (min):<br>
        <input type="number" name="minutes_walked" value="{{ walk.minutes_walked }}" required><br><br>
        Distance (km):<br>
        <input type="number" step="0.01" name="distance" value="{{ walk.distance }}" required><br><br>
        Steps:<br>
        <input type="number" name="steps" value="{{ walk.steps }}" required><br><br>
        <input type="submit" value="Save Changes">
        <a href="/">Cancel</a>
    </form>
</body>
</html>
